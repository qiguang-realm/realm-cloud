# ============================================================
# Gateway Server｜Spring Cloud Gateway
# 规范基线：CNCF Gateway API + REST + OpenAPI3
# 配套服务内部包结构：adapter/inbound/web/admin | app | external | internal | job
# 请求头契约：
#   X-Realm-Inbound-Kind = admin      -> B端管理后台
#   X-Realm-Inbound-Kind = app        -> C端App/小程序
#   X-Realm-Inbound-Kind = external   -> 第三方开放平台
#   X-Realm-Inbound-Kind = internal   -> 微服务之间内部调用
#   X-Realm-Inbound-Kind = job        -> 定时任务（不走网关）
#
# 路由ID规约：{resource-slug}-{inbound-kind}
# 例如：identity-admin, identity-app, identity-external, identity-internal
# ============================================================

# ============================================================
# Spring Boot 应用核心配置（gateway-server）
# ============================================================

spring:
  # ---- 应用基础 ----
  application:
    name: gateway-server

  profiles:
    active: local # 环境：local / dev / test / prod

  # ---- HTTP 编解码 ----
  http:
    codecs:
      max-in-memory-size: 10MB # 内存缓冲区上限

  # ---- Jackson 序列化 ----
  jackson:
    serialization:
      write-dates-as-timestamps: true # LocalDateTime 用时间戳
      write-date-timestamps-as-nanoseconds: false # 禁用纳秒时间戳
      write-durations-as-timestamps: true # Duration 用时间戳
      fail-on-empty-beans: false # 允许序列化无属性 Bean

  main:
    allow-circular-references: true # 三层架构需要

  # ---- 配置导入 ----
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml # 本地配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml # Nacos 配置

  # ---- Spring Cloud Gateway ----
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ========== realm-workforce-identity-server 身份域【核心服务】 ==========
            # 身份域 - Admin 管理后台视图：/identity/admin/**
            - id: workforce-identity-admin
              uri: lb://realm-workforce-identity-server
              predicates:
                - Path=/identity/admin/**
              filters:
                # 文档路径重写：网关侧 /identity/admin/v3/api-docs → 后端 /v3/api-docs
                - RewritePath=/identity/admin/v3/api-docs, /v3/api-docs
            # 身份域 - App C端视图：/identity/app/**
            - id: workforce-identity-app
              uri: lb://realm-workforce-identity-server
              predicates:
                - Path=/identity/app/**
              filters:
                - RewritePath=/identity/app/v3/api-docs, /v3/api-docs
            # 身份域 - External 开放平台第三方视图：/identity/external/**
            - id: workforce-identity-external
              uri: lb://realm-workforce-identity-server
              predicates:
                - Path=/identity/external/**
              filters:
                - RewritePath=/identity/external/v3/api-docs, /v3/api-docs
            # 【可选】身份域 internal 跨服务内部调用；建议：内网隔离，不暴露公网网关
            # - id: workforce-identity-internal
            #   uri: lb://realm-workforce-identity-server
            #   predicates:
            #     - Path=/identity/internal/**
            #   filters:
            #     - RewritePath=/identity/internal/v3/api-docs, /v3/api-docs

            # ---------- system-server ----------
            - id: system-admin-api
              uri: lb://system-server
              predicates:
                - Path=/system/admin/**
              filters:
                - RewritePath=/system/admin/v3/api-docs, /v3/api-docs
            - id: system-app-api
              uri: lb://system-server
              predicates:
                - Path=/system/app/**
              filters:
                - RewritePath=/system/app/v3/api-docs, /v3/api-docs

            # ---------- infra-server ----------
            - id: infra-admin-api
              uri: lb://infra-server
              predicates:
                - Path=/infra/admin/**
              filters:
                - RewritePath=/infra/admin/v3/api-docs, /v3/api-docs
            - id: infra-app-api
              uri: lb://infra-server
              predicates:
                - Path=/infra/app/**
              filters:
                - RewritePath=/infra/app/v3/api-docs, /v3/api-docs
            - id: infra-spring-boot-admin
              uri: lb://infra-server
              predicates:
                - Path=/admin/**
            - id: infra-websocket
              uri: lb://infra-server
              predicates:
                - Path=/infra/ws/**

            # ---------- member-server ----------
            - id: member-admin-api
              uri: lb://member-server
              predicates:
                - Path=/member/admin/**
              filters:
                - RewritePath=/member/admin/v3/api-docs, /v3/api-docs
            - id: member-app-api
              uri: lb://member-server
              predicates:
                - Path=/member/app/**
              filters:
                - RewritePath=/member/app/v3/api-docs, /v3/api-docs

            # ---------- report-server ----------
            - id: report-admin-api
              uri: lb://report-server
              predicates:
                - Path=/report/admin/**
              filters:
                - RewritePath=/report/admin/v3/api-docs, /v3/api-docs
            - id: report-jimu
              uri: lb://report-server
              predicates:
                - Path=/jmreport/**, /drag/**, /jimubi/**

            # ---------- pay-server ----------
            - id: pay-admin-api
              uri: lb://pay-server
              predicates:
                - Path=/pay/admin/**
              filters:
                - RewritePath=/pay/admin/v3/api-docs, /v3/api-docs
            - id: pay-app-api
              uri: lb://pay-server
              predicates:
                - Path=/pay/app/**
              filters:
                - RewritePath=/pay/app/v3/api-docs, /v3/api-docs

            # ---------- ai-server ----------
            - id: ai-admin-api
              uri: lb://ai-server
              predicates:
                - Path=/ai/admin/**
              filters:
                - RewritePath=/ai/admin/v3/api-docs, /v3/api-docs
            - id: ai-mcp-server
              uri: lb://ai-server
              predicates:
                - Path=/sse, /mcp/message

          # 转发头
          x-forwarded:
            prefix-enabled: false
          # 默认过滤器
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

server:
  port: 48080

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log

# ===== 接口文档聚合（Knife4j Gateway） =====
knife4j:
  gateway:
    enabled: true
    routes:
      # ==== 身份域文档聚合（admin/app/external 分开，文档隔离，推荐）====
      - name: 身份域-管理后台
        service-name: realm-workforce-identity-server
        url: /identity/admin/v3/api-docs
      - name: 身份域-C端App
        service-name: realm-workforce-identity-server
        url: /identity/app/v3/api-docs
      - name: 身份域-开放平台External
        service-name: realm-workforce-identity-server
        url: /identity/external/v3/api-docs

      # 服务同步更新url
      - name: system-server-管理后台
        service-name: system-server
        url: /system/admin/v3/api-docs
      - name: system-server-C端App
        service-name: system-server
        url: /system/app/v3/api-docs
      - name: infra-server-管理后台
        service-name: infra-server
        url: /infra/admin/v3/api-docs
      - name: infra-server-C端App
        service-name: infra-server
        url: /infra/app/v3/api-docs
      - name: member-server-管理后台
        service-name: member-server
        url: /member/admin/v3/api-docs
      - name: member-server-C端App
        service-name: member-server
        url: /member/app/v3/api-docs
      - name: report-server-管理后台
        service-name: report-server
        url: /report/admin/v3/api-docs
      - name: pay-server-管理后台
        service-name: pay-server
        url: /pay/admin/v3/api-docs
      - name: pay-server-C端App
        service-name: pay-server
        url: /pay/app/v3/api-docs
      - name: ai-server-管理后台
        service-name: ai-server
        url: /ai/admin/v3/api-docs

realm:
  info:
    version: 1.0.0

