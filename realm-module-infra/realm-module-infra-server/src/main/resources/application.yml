# ============================================================
# Spring Boot 应用核心配置（infra-server）
# ============================================================

spring:
  # ---- 应用基础 ----
  application:
    name: infra-server

  profiles:
    active: local # 环境：local / dev / test / prod

  main:
    allow-circular-references: true # 三层架构需要
    allow-bean-definition-overriding: true # 解决 Feign 重复定义

  # ---- 配置导入 ----
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml # 本地配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml # Nacos 配置

  # ---- 文件上传 ----
  servlet:
    multipart:
      max-file-size: 16MB # 单文件上限
      max-request-size: 32MB # 请求总上限

  # ---- Jackson 序列化 ----
  jackson:
    serialization:
      write-dates-as-timestamps: true # LocalDateTime 用时间戳
      write-date-timestamps-as-nanoseconds: false # 禁用纳秒时间戳
      write-durations-as-timestamps: true # Duration 用时间戳
      fail-on-empty-beans: false # 允许序列化无属性 Bean

  # ---- Redis 缓存 ----
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 缓存 TTL

  data:
    redis:
      repositories:
        enabled: false # 未用 Repository，关闭以加快启动

  # ---- Kafka ----
  kafka:
    producer:
      acks: 1 # 可选：0 / 1 / all
      retries: 3
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest # 消费偏移重置策略
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
    listener:
      missing-topics-fatal: false # 主题不存在不报错

# ===== Web 服务器 =====
server:
  port: 48082

# ===== 日志 =====
logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log

# ===== 接口文档 =====
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true # 参见 Knife4j 文档

knife4j:
  enable: true
  setting:
    language: zh_cn # 界面语言

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
  global-config:
    db-config:
      id-type: NONE # 智能模式，自动适配 AUTO/INPUT
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: ${realm.info.base-package}.dal.dataobject
  encryptor:
    password: XDV71a+xqStEA3WH # AES 加密密钥，可在线生成

mybatis-plus-join:
  banner: false

# ===== 数据翻译 =====
easy-trans:
  is-enable-global: false # 关闭全局翻译，性能考虑

# ===== 消息队列 =====
rocketmq:
  producer:
    group: ${spring.application.name}_PRODUCER

# ===== 定时任务 =====
xxl:
  job:
    executor:
      appname: ${spring.application.name}
      logpath: ${user.home}/logs/xxl-job/${spring.application.name}
    accessToken: default_token # 通讯 Token

# ===== Realm 自定义 =====
realm:
  info:
    version: 1.0.0
    base-package: cn.realm.cloud.infra

  web:
    admin-ui:
      url: http://dashboard.realm.cn

  xss:
    enable: false
    exclude-urls:
      - ${spring.boot.admin.context-path}/** # Spring Boot Admin 端点
      - ${management.endpoints.web.base-path}/** # Actuator 端点

  websocket:
    enable: true
    path: /infra/ws
    sender-type: local # 可选：local / redis / rocketmq / kafka / rabbitmq
    sender-rocketmq:
      topic: ${spring.application.name}-websocket
      consumer-group: ${spring.application.name}-websocket-consumer
    sender-rabbitmq:
      exchange: ${spring.application.name}-websocket-exchange
      queue: ${spring.application.name}-websocket-queue
    sender-kafka:
      topic: ${spring.application.name}-websocket
      consumer-group: ${spring.application.name}-websocket-consumer

  swagger:
    title: 管理后台 / Admin console
    description: 提供管理员管理的所有功能 / Provides all admin management capabilities
    version: ${realm.info.version}

  codegen:
    base-package: cn.realm
    db-schemas: ${spring.datasource.dynamic.datasource.master.name}
    front-type: 20 # 前端模板类型，见 CodegenFrontTypeEnum
    vo-type: 10 # VO 类型，见 CodegenVOTypeEnum
    delete-batch-enable: true
    unit-test-enable: false
    import-enable: false

  tenant:
    enable: true
    ignore-urls: [] # 忽略租户的 URL
    ignore-tables: [] # 忽略租户过滤的表

# ===== 调试模式 =====
debug: false
